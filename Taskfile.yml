version: '3'

vars:
  BINARY: ssmsearch
  BUILD_DIR: bin
  BREW_FORMULA: eugenetaranov/tap/ssmsearch
  VERSION:
    sh: git describe --tags --exact-match 2>/dev/null || echo "dev"
  COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  LDFLAGS: -ldflags "-X main.version={{.VERSION}} -X main.gitCommit={{.COMMIT}}"
  LATEST_TAG:
    sh: git tag --sort=-version:refname 2>/dev/null | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true

tasks:
  build:
    desc: Build binary into bin/
    cmds:
      - mkdir -p {{.BUILD_DIR}}
      - go build {{.LDFLAGS}} -o {{.BUILD_DIR}}/{{.BINARY}} ./cmd/ssmsearch

  install:
    desc: Install binary with go install
    cmds:
      - go install {{.LDFLAGS}} ./cmd/ssmsearch

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}

  test:
    desc: Run tests
    cmds:
      - go test -race -v ./...

  lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run ./...

  fmt:
    desc: Format code
    cmds:
      - go fmt ./...

  deps:
    desc: Download and tidy modules
    cmds:
      - go mod download
      - go mod tidy

  release:
    desc: "Create and push a release tag (usage: task release [TAG=v1.0.0])"
    interactive: true
    silent: true
    cmds:
      - |
        TAG="{{.TAG}}"
        if [ -z "$TAG" ]; then
          LATEST="{{.LATEST_TAG}}"
          if [ -z "$LATEST" ]; then
            SUGGESTED="v0.1.0"
          else
            MAJOR=$(echo $LATEST | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\1/')
            MINOR=$(echo $LATEST | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\2/')
            PATCH=$(echo $LATEST | sed 's/v\([0-9]*\)\.\([0-9]*\)\.\([0-9]*\)/\3/')
            SUGGESTED="v$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          echo "Latest tag: ${LATEST:-none}"
          printf "Enter tag [$SUGGESTED]: "
          read INPUT_TAG
          TAG=${INPUT_TAG:-$SUGGESTED}
        fi
        echo "Creating release $TAG..."
        git tag -a $TAG -m "Release $TAG"
        git push origin $TAG
        echo "Release $TAG pushed. GitHub Actions will build and publish artifacts."

  upgrade-local:
    desc: "Watch the release run, then upgrade/install via Homebrew if available (usage: task upgrade-local [TAG=v1.0.0])"
    silent: true
    vars:
      TAG: '{{.TAG | default .LATEST_TAG}}'
    preconditions:
      - sh: '[ -n "{{.TAG}}" ]'
        msg: No release tag found
    cmds:
      - |
        echo "Waiting for release run for {{.TAG}}..."
        for i in $(seq 1 30); do
          RUN_ID=$(gh run list --workflow release.yaml --branch {{.TAG}} --limit 1 --json databaseId --jq '.[0].databaseId')
          [ -n "$RUN_ID" ] && break
          sleep 2
        done
        if [ -z "$RUN_ID" ]; then echo "No release run found for {{.TAG}}"; exit 1; fi
        gh run watch $RUN_ID --exit-status
      - |
        if ! command -v brew >/dev/null 2>&1; then
          echo "brew not found, skipping install"
          exit 0
        fi
        brew update
        if brew list --formula ssmsearch >/dev/null 2>&1; then
          brew upgrade {{.BREW_FORMULA}}
        else
          brew install {{.BREW_FORMULA}}
        fi
        ssmsearch -v

  release-dry-run:
    desc: "GoReleaser: test release configuration without publishing"
    cmds:
      - goreleaser release --snapshot --clean --skip=publish

  release-snapshot:
    desc: "GoReleaser: create snapshot release (for testing)"
    cmds:
      - goreleaser release --snapshot --clean

  release-check:
    desc: "GoReleaser: check configuration"
    cmds:
      - goreleaser check
